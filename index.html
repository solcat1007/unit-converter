<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>单位换算 · 常用单位互转 v2.0</title>
<meta name="description" content="长度、重量、温度、面积、体积、时间、速度、数据存储、角度、压力、能量等单位互转，带换算历史">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<meta name="theme-color" content="#42a5f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="单位换算">
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f7f9fb;
  --text:#16181d; --soft:#5d636e; --mute:#8b929e; --line:#e6e8ec;
  --accent:#42a5f5; --accent-soft:#e7f2fd;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --ease:cubic-bezier(.4,0,.2,1);
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);
  background-image:radial-gradient(120% 70% at 50% 0%,var(--accent-soft) 0%,rgba(255,255,255,0) 62%);
  background-attachment:fixed;color:var(--text);min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;padding:20px 16px 44px;
  -webkit-font-smoothing:antialiased;
}
.app{width:100%;max-width:520px;display:flex;flex-direction:column;gap:16px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:2px}
.head h1{font-size:22px;font-weight:700;letter-spacing:.5px}
.head p{font-size:12px;color:var(--mute);margin-top:5px;line-height:1.5}
.lang{
  flex-shrink:0;padding:7px 14px;font-size:12px;font-weight:600;font-family:inherit;
  background:var(--surface);color:var(--soft);border:1px solid var(--line);
  border-radius:999px;cursor:pointer;transition:all .2s var(--ease);
}
.lang:hover{border-color:var(--accent);color:var(--accent)}
.card{
  width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);
}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-hd .t{font-size:14px;font-weight:600}
.link{font-family:inherit;font-size:12px;color:var(--mute);background:none;border:0;cursor:pointer}
.link:hover{color:var(--accent)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--mute);margin-bottom:6px;letter-spacing:1px}
select,input[type=number],input[type=text]{
  width:100%;padding:12px 14px;font-size:16px;font-family:inherit;
  border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--surface-2);color:var(--text);
}
select:focus,input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swap{display:flex;justify-content:center;margin:0 0 14px}
.chip{
  padding:9px 16px;font-size:13px;font-weight:500;font-family:inherit;
  background:var(--surface);color:var(--soft);border:1px solid var(--line);
  border-radius:999px;cursor:pointer;transition:all .2s var(--ease);
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(66,165,245,.28)}
.result{
  position:relative;background:var(--accent-soft);border:1px solid var(--accent);
  border-radius:var(--r-md);padding:16px;text-align:center;cursor:pointer;
  user-select:none;-webkit-user-select:none;transition:transform .15s var(--ease);
}
.result:active{transform:scale(.99)}
.result .k{font-size:11px;color:var(--soft);letter-spacing:1px}
.result .v{font-size:28px;font-weight:700;color:var(--accent);margin:6px 0;word-break:break-all;font-variant-numeric:tabular-nums}
.result .tip{font-size:11px;color:var(--mute)}
.history{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto}
.hist-row{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);cursor:pointer;transition:all .2s var(--ease);
}
.hist-row:hover{border-color:var(--accent);background:#fff}
.hist-row .ht{flex:1;font-size:13px;color:var(--soft);word-break:break-all}
.hist-row .hr{font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.empty{font-size:12px;color:var(--mute);text-align:center;padding:16px 0}
.hint{font-size:12px;color:var(--mute);text-align:center;line-height:1.7}
.toast{
  position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);
  background:rgba(22,24,29,.92);color:#fff;padding:10px 20px;border-radius:999px;
  font-size:13px;z-index:1000;opacity:0;pointer-events:none;transition:all .25s var(--ease);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:380px){.grid2{grid-template-columns:1fr}.result .v{font-size:24px}}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div><h1 id="t_title">单位换算</h1><p id="t_sub">选择类别，输入数值即时双向换算</p></div>
    <button class="lang" id="langBtn" onclick="toggleLang()">EN</button>
  </div>

  <div class="card">
    <div class="field">
      <label id="t_cat">类别</label>
      <select id="cat" onchange="onCategoryChange()"></select>
    </div>
    <div class="grid2">
      <div class="field">
        <label id="t_from">从</label>
        <select id="from" onchange="convertFrom()"></select>
      </div>
      <div class="field">
        <label id="t_amount">数值</label>
        <input type="number" id="amount" value="1" oninput="convertFrom()">
      </div>
    </div>
    <div class="swap"><button class="chip" onclick="swapUnits()">⇅ <span id="t_swap">交换单位</span></button></div>
    <div class="field">
      <label id="t_to">到</label>
      <select id="to" onchange="convertFrom()"></select>
    </div>
    <div class="result" id="resultBox" title="长按复制结果">
      <div class="k" id="t_result">换算结果</div>
      <div class="v" id="result">—</div>
      <div class="tip" id="t_copy">长按结果可复制</div>
    </div>
  </div>

  <div class="card">
    <div class="card-hd"><span class="t" id="t_hist">换算历史</span>
      <button class="link" id="t_clear" onclick="clearHistory()">清空</button></div>
    <div class="history" id="history"></div>
  </div>

  <div class="hint" id="t_hint">温度采用专用公式换算，不走统一系数 · 历史保存在本地</div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
 * 单位换算 v2.0
 * ------------------------------------------------------------
 * 统一模型：base = value * factor，result = base / targetFactor。
 * 温度为非线性特例，用 to/from 函数对处理。
 * v2.0 新增：角度/压力/能量类别、换算历史、长按复制结果。
 * ========================================================== */

const UNITS = {
  length: { label:'长度', units:{
    '毫米 mm':0.001, '厘米 cm':0.01, '米 m':1, '千米 km':1000,
    '英寸 in':0.0254, '英尺 ft':0.3048, '码 yd':0.9144, '英里 mi':1609.344
  }},
  weight: { label:'重量', units:{
    '毫克 mg':0.000001, '克 g':0.001, '千克 kg':1, '吨 t':1000,
    '磅 lb':0.45359237, '盎司 oz':0.028349523, '市斤':0.5
  }},
  area: { label:'面积', units:{
    '平方毫米':0.000001, '平方厘米':0.0001, '平方米':1,
    '公顷 ha':10000, '平方千米':1000000, '英亩 acre':4046.8564224
  }},
  volume: { label:'体积', units:{
    '毫升 mL':0.001, '升 L':1, '立方米 m³':1000,
    '美制加仑':3.785411784, '英制加仑':4.54609, '美制杯':0.2365882365
  }},
  time: { label:'时间', units:{
    '毫秒':0.001, '秒':1, '分钟':60, '小时':3600, '天':86400,
    '周':604800, '月(30天)':2592000, '年(365天)':31536000
  }},
  speed: { label:'速度', units:{
    '米/秒':1, '千米/小时':0.2777777778, '英里/小时':0.44704, '节 kn':0.5144444444
  }},
  data: { label:'数据存储', units:{
    'KB':0.001, 'MB':1, 'GB':1000, 'TB':1000000
  }},
  angle: { label:'角度', units:{
    '度 °':1, '弧度 rad':57.29577951308232, '梯度 gon':0.9,
    '角分 ′':1/60, '角秒 ″':1/3600, '圈 turn':360
  }},
  pressure: { label:'压力', units:{
    '帕 Pa':0.001, '千帕 kPa':1, '兆帕 MPa':1000, '巴 bar':100,
    '标准大气压 atm':101.325, '毫米汞柱 mmHg':0.133322, '磅力/平方英寸 psi':6.894757
  }},
  energy: { label:'能量', units:{
    '焦耳 J':1, '千焦 kJ':1000, '卡 cal':4.184, '千卡 kcal':4184,
    '瓦时 Wh':3600, '千瓦时 kWh':3600000, '电子伏特 eV':1.602176634e-19
  }}
};

const TEMP = {
  label:'温度',
  units:{
    '摄氏 °C': { to:function(v){return v;}, from:function(v){return v;} },
    '华氏 °F': { to:function(v){return (v-32)*5/9;}, from:function(v){return v*9/5+32;} },
    '开尔文 K':{ to:function(v){return v-273.15;}, from:function(v){return v+273.15;} }
  }
};

function isTemp(k){ return k === '__temp__'; }

const I18N = {
  zh:{ title:'单位换算', sub:'选择类别，输入数值即时双向换算',
       hint:'温度采用专用公式换算，不走统一系数 · 历史保存在本地',
       cat:'类别', from:'从', to:'到', amount:'数值', result:'换算结果',
       swap:'交换单位', copy:'长按结果可复制', copied:'结果已复制',
       hist:'换算历史', clear:'清空', empty:'还没有换算记录',
       cats:{length:'长度',weight:'重量',area:'面积',volume:'体积',time:'时间',
             speed:'速度',data:'数据存储',angle:'角度',pressure:'压力',energy:'能量','__temp__':'温度'} },
  en:{ title:'Unit Converter', sub:'Pick a category, type a value to convert instantly',
       hint:'Temperature uses its own formulas · History stored locally',
       cat:'Category', from:'From', to:'To', amount:'Amount', result:'Result',
       swap:'Swap units', copy:'Long-press result to copy', copied:'Result copied',
       hist:'History', clear:'Clear', empty:'No conversions yet',
       cats:{length:'Length',weight:'Weight',area:'Area',volume:'Volume',time:'Time',
             speed:'Speed',data:'Data',angle:'Angle',pressure:'Pressure',energy:'Energy','__temp__':'Temperature'} }
};
let lang = 'zh';

/* ---------- 下拉构建 ---------- */
function buildCategories(){
  const sel = document.getElementById('cat');
  const cur = sel.value;
  sel.innerHTML = '';
  const cats = I18N[lang].cats;
  Object.keys(UNITS).forEach(function(k){
    const o = document.createElement('option');
    o.value = k; o.textContent = cats[k] || UNITS[k].label;
    sel.appendChild(o);
  });
  const t = document.createElement('option');
  t.value = '__temp__'; t.textContent = cats['__temp__'];
  sel.appendChild(t);
  if (cur) sel.value = cur;
}

function buildUnitOptions(){
  const key = document.getElementById('cat').value;
  const names = isTemp(key) ? Object.keys(TEMP.units) : Object.keys(UNITS[key].units);
  ['from','to'].forEach(function(id){
    const sel = document.getElementById(id);
    sel.innerHTML = '';
    names.forEach(function(n){
      const o = document.createElement('option');
      o.value = n; o.textContent = n;
      sel.appendChild(o);
    });
  });
  if (names.length > 1) document.getElementById('to').selectedIndex = 1;
}

function onCategoryChange(){ buildUnitOptions(); convertFrom(); }

/* ---------- 换算 ---------- */
function formatResult(result){
  const a = Math.abs(result);
  return (a !== 0 && (a < 0.001 || a >= 1e6))
    ? result.toExponential(4)
    : parseFloat(result.toFixed(6)).toString();
}

function convertFrom(record){
  const key = document.getElementById('cat').value;
  const from = document.getElementById('from').value;
  const to   = document.getElementById('to').value;
  const raw  = document.getElementById('amount').value;
  const val  = parseFloat(raw);
  const out  = document.getElementById('result');
  if (raw === '' || isNaN(val)){ out.textContent = '—'; return null; }

  let result;
  if (isTemp(key)){
    result = TEMP.units[to].from(TEMP.units[from].to(val));
  } else {
    const m = UNITS[key].units;
    result = (val * m[from]) / m[to];
  }
  const text = formatResult(result);
  out.textContent = text;

  if (record !== false){
    clearTimeout(convertFrom._t);
    convertFrom._t = setTimeout(function(){
      addHistory({ cat:key, from:from, to:to, val:val, result:text });
    }, 500);
  }
  return text;
}

function swapUnits(){
  const f = document.getElementById('from'), t = document.getElementById('to');
  const i = f.selectedIndex;
  f.selectedIndex = t.selectedIndex;
  t.selectedIndex = i;
  convertFrom();
}

/* ---------- 历史记录 ---------- */
const HKEY = 'unit_converter_history_v2';
let history = [];
function loadHistory(){ try{ history = JSON.parse(localStorage.getItem(HKEY)) || []; }catch(e){ history = []; } }
function saveHistory(){ try{ localStorage.setItem(HKEY, JSON.stringify(history)); }catch(e){} }
function addHistory(rec){
  const last = history[0];
  if (last && last.cat===rec.cat && last.from===rec.from && last.to===rec.to && last.val===rec.val) return;
  history.unshift(rec);
  history = history.slice(0, 30);
  saveHistory(); renderHistory();
}
function clearHistory(){ history = []; saveHistory(); renderHistory(); toast(I18N[lang].clear); }
function renderHistory(){
  const box = document.getElementById('history');
  box.innerHTML = '';
  if (!history.length){
    const d = document.createElement('div');
    d.className = 'empty'; d.textContent = I18N[lang].empty;
    box.appendChild(d); return;
  }
  history.forEach(function(h){
    const row = document.createElement('div');
    row.className = 'hist-row';
    const tx = document.createElement('div');
    tx.className = 'ht';
    tx.textContent = h.val + ' ' + h.from + ' → ' + h.to;
    const rs = document.createElement('div');
    rs.className = 'hr';
    rs.textContent = h.result;
    row.appendChild(tx); row.appendChild(rs);
    row.onclick = function(){
      document.getElementById('cat').value = h.cat;
      buildUnitOptions();
      document.getElementById('from').value = h.from;
      document.getElementById('to').value = h.to;
      document.getElementById('amount').value = h.val;
      convertFrom(false);
    };
    box.appendChild(row);
  });
}

/* ---------- 复制（长按 / 双击） ---------- */
let pressTimer = null, longPressed = false;
const resultBox = document.getElementById('resultBox');
function startPress(){
  longPressed = false;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(function(){
    longPressed = true;
    copyResult();
  }, 600);
}
function endPress(){ clearTimeout(pressTimer); }
resultBox.addEventListener('pointerdown', startPress);
['pointerup','pointerleave','pointercancel'].forEach(function(ev){
  resultBox.addEventListener(ev, endPress);
});
resultBox.addEventListener('dblclick', copyResult);
function copyResult(){
  const txt = document.getElementById('result').textContent;
  if (!txt || txt === '—') return;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast(I18N[lang].copied); }, fallbackCopy);
  } else fallbackCopy();
  function fallbackCopy(){
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta); toast(I18N[lang].copied);
  }
}
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = '☠ ' + msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1600);
}
window.__UC_TOAST__ = toast;

/* ---------- 中英切换 ---------- */
function refresh(){
  const L = I18N[lang];
  ['title','sub','hint','cat','from','to','amount','result','swap','copy','hist','clear']
    .forEach(function(k){ document.getElementById('t_'+k).textContent = L[k]; });
  document.getElementById('langBtn').textContent = (lang==='zh') ? 'EN' : '中';
  buildCategories(); buildUnitOptions(); renderHistory(); convertFrom(false);
}
function toggleLang(){ lang = (lang==='zh') ? 'en' : 'zh'; refresh(); }

loadHistory();
refresh();

if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>

  function cyberTheme(){
    var s=document.getElementById('__egg_cyber');
    if(s){ s.remove(); document.body.classList.remove('egg-cyber'); return; }
    s=document.createElement('style'); s.id='__egg_cyber';
    s.textContent='body.egg-cyber{filter:invert(1) hue-rotate(180deg)!important;}'+
      'body.egg-cyber *{font-family:"Courier New",monospace!important;letter-spacing:1px}';
    document.head.appendChild(s); document.body.classList.add('egg-cyber');
    unlock('cyber','☠ 赛博模式已启用');
  }

  /* ---------- 5. 解锁分发 ---------- */
  function unlock(id,msg){
    if (E.unlocked.has(id)) return;
    E.unlocked.add(id);
    if (msg) console.log('%c[EGG] '+msg,'color:#ffca28;font-weight:bold');
    E.onUnlock.forEach(function(fn){ try{fn(id);}catch(e){} });
    var t=document.createElement('div');
    t.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);'+
      'z-index:99997;background:rgba(18,20,26,.92);color:#ffca28;padding:18px 28px;'+ 
      'border:1px solid #ffca28;border-radius:12px;font:14px ui-monospace,monospace;'+
      'pointer-events:none;animation:eggIn .3s ease;box-shadow:0 8px 30px rgba(0,0,0,.4)';
    t.textContent='☠ '+msg;
    document.body.appendChild(t); setTimeout(function(){t.remove();},2200);
  }

  /* ---------- 6. 事件绑定 ---------- */
  function init(){
    var app = document.title || 'SOLCAT App';
    banner();

    // Konami 秘籍
    addEventListener('keydown', function(e){
      var k = e.key.length===1 ? e.key.toLowerCase() : e.key;
      seq.push(k); if(seq.length>KONAMI.length) seq.shift();
      if (seq.length===KONAMI.length && KONAMI.every(function(v,i){return seq[i]===v;})){
        seq=[]; confetti(); unlock('konami','KONAMI CODE 已激活！');
      }
      // Ctrl+Shift+T → 赛博主题
      if (e.ctrlKey && e.shiftKey && (e.key==='T'||e.key==='t')){
        e.preventDefault(); cyberTheme();
      }
      // 输入 solcat
      if (e.key==='Enter' && window.__eggBuf__ === 'solcat'){ cyberTheme(); window.__eggBuf__=''; }
      if (k.length===1) window.__eggBuf__ = ((window.__eggBuf__||'')+k).slice(-10);
    });

    // 连点标题 5 次 → 开发者面板
    addEventListener('DOMContentLoaded', function(){
      var targets = document.querySelectorAll('h1,.head h1,.logo,header h1');
      var t = targets[0];
      if(t){ t.style.cursor='default'; t.addEventListener('click',function(){
        logoClicks++;
        clearTimeout(logoTimer);
        logoTimer=setTimeout(function(){logoClicks=0;},900);
        if(logoClicks>=5){ logoClicks=0; devPanel(app); unlock('dev','开发者模式已解锁'); }
      });}
      // 给 body 加动画 keyframe
      var a=document.createElement('style');
      a.textContent='@keyframes eggIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}';
      document.head.appendChild(a);
    });

    console.log('%c☠ 彩蛋引擎已加载 — 祝你玩得开心','color:#26a69a');
  }

  if (document.readyState==='loading') addEventListener('DOMContentLoaded',init);
  else init();
})();

</script>
<script>
(function(){
  var E = window.__SOLCAT_EGG__;
  if (!E) return;

    var fired = false;
    E.onUnlock.push(function(id){
      if (fired || ['konami','dev','cyber'].indexOf(id) < 0) return;
      fired = true;
      document.getElementById('result').textContent = '42';
      toast(id === 'konami' ? '42 —— 万物终极答案！' : '隐藏答案已解锁：42');
      setTimeout(function(){ convertFrom(false); }, 2800);
    });
})();
</script>
